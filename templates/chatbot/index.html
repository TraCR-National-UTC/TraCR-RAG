{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>TraCR-AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/chatbot/style.css" rel="stylesheet" />
  <!-- Syntax highlighting -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script>
    // Tell Marked to highlight code blocks using highlight.js
    if (window.marked) {
      window.marked.setOptions({
        highlight: function (code, lang) {
          try {
            return hljs.highlight(code, { language: lang || "plaintext" }).value;
          } catch (e) {
            return hljs.highlightAuto(code).value;
          }
        },
      });
    }
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <center>
            <img src="{% static 'tracr_logo_rb.png' %}" style="width: 60%;" alt="TraCR-AI Logo" class="logo" />
            <br>
            TraCR-AI</div>
        </center>

      <button id="newChat" class="btn">+ New chat</button>
      <button id="themeToggle" class="btn theme-toggle">
        <svg class="theme-icon sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <div id="history" class="history"></div>
      <div class="footer">© Transportation Cybersecurity and Resiliency (TraCR)</div>
    </aside>

    <main class="main">
      <div id="chat" class="chat"></div>

      <div class="composer">
        <textarea id="msg" placeholder="Message…"></textarea>
        <button id="send" class="send">Send</button>
      </div>
    </main>
  </div>

  <!-- <script src="/static/chatbot/marked.min.js"></script> -->
   


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- <script>hljs.highlightAll();</script> -->

  <script src="/static/chatbot/chat.js"></script>
</body>
</html>
